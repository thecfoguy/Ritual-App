<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Ritual</title>
  <link rel="manifest" href="manifest.json" />

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0b;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(
          circle at 50% 30%,
          #1b1b1b 0%,
          #0b0b0b 55%,
          #050505 100%
        );
    }

    header {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.18em;
      user-select: none;
      position: relative;
    }

    #backupTools {
      position: absolute;
      right: 10px;
      display: flex;
      gap: 6px;
    }

    #backupTools button {
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 9px;
      background: #292929;
      color: white;
      padding: 7px 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
    }

    #restoreInput {
      display: none;
    }

    #viewport {
      flex: 1;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
    }

    #card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 26px 28px 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      overflow: hidden;
      transition:
        opacity 140ms ease,
        transform 140ms ease;
    }

    #card.changing-left {
      opacity: 0;
      transform: translateX(-25px);
    }

    #card.changing-right {
      opacity: 0;
      transform: translateX(25px);
    }

    .quote {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(29px, 7vw, 54px);
      line-height: 1.18;
      font-weight: 600;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .author {
      width: 100%;
      max-width: 820px;
      margin: 28px auto 0;
      font-size: clamp(16px, 4vw, 22px);
      opacity: .72;
      letter-spacing: .04em;
      text-align: center;
    }

    #counter {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(26px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 13px;
      opacity: .45;
      pointer-events: none;
      user-select: none;
    }

    #addBtn {
      position: fixed;
      right: 22px;
      bottom: calc(34px + env(safe-area-inset-bottom));
      width: 66px;
      height: 66px;
      border: 2px solid rgba(255,255,255,.24);
      border-radius: 50%;
      background: linear-gradient(145deg, #32d46b, #149447);
      color: white;
      font-size: 42px;
      font-weight: 400;
      line-height: 58px;
      box-shadow:
        0 10px 28px rgba(0,0,0,.52),
        0 3px 9px rgba(32,198,90,.32),
        inset 0 1px 0 rgba(255,255,255,.20);
      z-index: 20;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 0 4px 0;
    }

    #addBtn:active {
      transform: scale(.94);
      box-shadow:
        0 5px 16px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.16);
    }

    #modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.72);
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }

    #modal.open {
      display: flex;
    }

    .sheet {
      width: min(680px, 100%);
      background: #181818;
      border: 1px solid #303030;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 15px 60px rgba(0,0,0,.6);
    }

    .sheet h2 {
      margin: 2px 0 14px;
      font-size: 22px;
    }

    textarea,
    input {
      width: 100%;
      border: 1px solid #3a3a3a;
      border-radius: 13px;
      background: #0d0d0d;
      color: white;
      padding: 14px;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 145px;
      resize: vertical;
      font-size: 18px;
    }

    input {
      margin-top: 10px;
      font-size: 16px;
    }

    textarea:focus,
    input:focus {
      border-color: #20c65a;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .actions button {
      flex: 1;
      min-height: 50px;
      border-radius: 13px;
      border: 0;
      font-size: 17px;
      font-weight: 700;
    }

    #cancelBtn {
      background: #303030;
      color: white;
    }

    #saveBtn {
      background: #20c65a;
      color: white;
    }

    .hint {
      position: fixed;
      left: 18px;
      bottom: calc(44px + env(safe-area-inset-bottom));
      font-size: 12px;
      opacity: .35;
      user-select: none;
      pointer-events: none;
    }

    .quoteTools {
      position: absolute;
      bottom: calc(92px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .quoteTools button {
      min-width: 82px;
      min-height: 42px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      background: #292929;
    }

    .quoteTools .deleteQuoteBtn {
      background: #7d2020;
    }

    @media (max-height: 600px) {
      #card {
        padding-bottom: 90px;
      }

      #addBtn {
        width: 56px;
        height: 56px;
        font-size: 38px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="app">

    <header>
      RITUAL

      <div id="backupTools">
        <button id="backupBtn" type="button">Backup</button>
        <button id="restoreBtn" type="button">Restore</button>
        <input
          id="restoreInput"
          type="file"
          accept=".json,application/json"
        />
      </div>
    </header>

    <main id="viewport">

      <section id="card">

        <div
          id="quoteDisplay"
          class="quote"
        ></div>

        <div
          id="authorDisplay"
          class="author"
        ></div>

        <div class="quoteTools">

          <button
            id="editQuoteBtn"
            type="button"
          >
            Edit
          </button>

          <button
            id="deleteQuoteBtn"
            class="deleteQuoteBtn"
            type="button"
          >
            Delete
          </button>

        </div>

      </section>

    </main>

    <div class="hint">
      Swipe ← →
    </div>

    <div id="counter"></div>

    <button
      id="addBtn"
      aria-label="Add quote"
    >
      +
    </button>

    <div
      id="modal"
      aria-hidden="true"
    >

      <div class="sheet">

        <h2>
          Add a quote
        </h2>

        <textarea
          id="quoteInput"
          placeholder="Type or paste your quote here…"
        ></textarea>

        <input
          id="authorInput"
          placeholder="Author (optional)"
        />

        <div class="actions">

          <button id="cancelBtn">
            Cancel
          </button>

          <button id="saveBtn">
            Save Quote
          </button>

        </div>

      </div>

    </div>

  </div>

  <script>
    const starterQuotes = [
      {
        text: "The impediment to action advances action. What stands in the way becomes the way.",
        author: "Marcus Aurelius"
      },
      {
        text: "Waste no more time arguing what a good man should be. Be one.",
        author: "Marcus Aurelius"
      },
      {
        text: "He who has a why to live can bear almost any how.",
        author: "Friedrich Nietzsche"
      }
    ];

    let quotes;

    try {
      quotes =
        JSON.parse(
          localStorage.getItem("ritual_quotes")
        ) || starterQuotes;

      if (
        !Array.isArray(quotes) ||
        quotes.length === 0
      ) {
        quotes = starterQuotes;
      }
    } catch {
      quotes = starterQuotes;
    }

    let index = 0;
    let editingIndex = null;
    let changing = false;

    const viewport =
      document.getElementById("viewport");

    const card =
      document.getElementById("card");

    const quoteDisplay =
      document.getElementById("quoteDisplay");

    const authorDisplay =
      document.getElementById("authorDisplay");

    const counter =
      document.getElementById("counter");

    const modal =
      document.getElementById("modal");

    const quoteInput =
      document.getElementById("quoteInput");

    const authorInput =
      document.getElementById("authorInput");

    const restoreInput =
      document.getElementById("restoreInput");

    const editQuoteBtn =
      document.getElementById("editQuoteBtn");

    const deleteQuoteBtn =
      document.getElementById("deleteQuoteBtn");

    function saveQuotes() {
      localStorage.setItem(
        "ritual_quotes",
        JSON.stringify(quotes)
      );
    }

    function render() {
      if (quotes.length === 0) {
        quotes = starterQuotes.map(
          q => ({ ...q })
        );

        saveQuotes();
      }

      index = Math.max(
        0,
        Math.min(
          index,
          quotes.length - 1
        )
      );

      const q = quotes[index];

      quoteDisplay.textContent =
        q.text;

      if (q.author) {
        authorDisplay.textContent =
          `— ${q.author}`;

        authorDisplay.style.display =
          "block";
      } else {
        authorDisplay.textContent =
          "";

        authorDisplay.style.display =
          "none";
      }

      counter.textContent =
        `${index + 1} / ${quotes.length}`;
    }

    function getRandomIndex() {
      if (quotes.length <= 1) {
        return index;
      }

      let randomIndex = index;

      while (randomIndex === index) {
        randomIndex =
          Math.floor(
            Math.random() *
            quotes.length
          );
      }

      return randomIndex;
    }

    function goRandom(direction) {
      if (
        changing ||
        quotes.length <= 1
      ) {
        return;
      }

      const newIndex =
        getRandomIndex();

      changing = true;

      if (direction === "left") {
        card.classList.add(
          "changing-left"
        );
      } else {
        card.classList.add(
          "changing-right"
        );
      }

      setTimeout(() => {
        index = newIndex;

        render();

        card.style.transition = "none";

        if (direction === "left") {
          card.style.transform =
            "translateX(25px)";
        } else {
          card.style.transform =
            "translateX(-25px)";
        }

        card.style.opacity = "0";

        card.classList.remove(
          "changing-left",
          "changing-right"
        );

        void card.offsetWidth;

        card.style.transition =
          "opacity 140ms ease, transform 140ms ease";

        card.style.opacity = "1";
        card.style.transform =
          "translateX(0)";

        setTimeout(() => {
          card.style.opacity = "";
          card.style.transform = "";
          card.style.transition = "";
          changing = false;
        }, 150);

      }, 140);
    }

    let startX = 0;
    let startY = 0;
    let dragging = false;

    viewport.addEventListener(
      "touchstart",
      e => {
        if (
          e.touches.length !== 1
        ) {
          return;
        }

        startX =
          e.touches[0].clientX;

        startY =
          e.touches[0].clientY;

        dragging = true;
      },
      {
        passive: true
      }
    );

    viewport.addEventListener(
      "touchmove",
      e => {
        if (
          !dragging ||
          e.touches.length !== 1
        ) {
          return;
        }

        const dx =
          e.touches[0].clientX -
          startX;

        const dy =
          e.touches[0].clientY -
          startY;

        if (
          Math.abs(dx) >
          Math.abs(dy)
        ) {
          e.preventDefault();
        }
      },
      {
        passive: false
      }
    );

    viewport.addEventListener(
      "touchend",
      e => {
        if (!dragging) {
          return;
        }

        dragging = false;

        const endX =
          e.changedTouches[0].clientX;

        const dx =
          endX - startX;

        if (dx < -55) {
          goRandom("left");
        } else if (dx > 55) {
          goRandom("right");
        }
      },
      {
        passive: true
      }
    );

    document
      .getElementById("backupBtn")
      .addEventListener(
        "click",
        () => {
          const backup = {
            app: "Ritual",
            version: 1,
            createdAt:
              new Date().toISOString(),
            quotes
          };

          const blob =
            new Blob(
              [
                JSON.stringify(
                  backup,
                  null,
                  2
                )
              ],
              {
                type:
                  "application/json"
              }
            );

          const url =
            URL.createObjectURL(
              blob
            );

          const link =
            document.createElement(
              "a"
            );

          const date =
            new Date()
              .toISOString()
              .slice(0, 10);

          link.href = url;

          link.download =
            `ritual-backup-${date}.json`;

          document.body
            .appendChild(link);

          link.click();

          link.remove();

          setTimeout(
            () =>
              URL.revokeObjectURL(
                url
              ),
            1000
          );
        }
      );

    document
      .getElementById("restoreBtn")
      .addEventListener(
        "click",
        () => {
          restoreInput.value = "";

          restoreInput.click();
        }
      );

    restoreInput.addEventListener(
      "change",
      async () => {
        const file =
          restoreInput.files &&
          restoreInput.files[0];

        if (!file) {
          return;
        }

        try {
          const data =
            JSON.parse(
              await file.text()
            );

          const restoredQuotes =
            Array.isArray(data)
              ? data
              : data.quotes;

          const valid =
            Array.isArray(
              restoredQuotes
            ) &&
            restoredQuotes.length > 0 &&
            restoredQuotes.every(
              q =>
                q &&
                typeof q.text ===
                  "string" &&
                typeof (
                  q.author ?? ""
                ) === "string"
            );

          if (!valid) {
            alert(
              "That is not a valid Ritual backup file."
            );

            return;
          }

          if (
            !confirm(
              `Restore ${restoredQuotes.length} quotes? This will replace the quotes currently on this phone.`
            )
          ) {
            return;
          }

          quotes =
            restoredQuotes.map(
              q => ({
                text: q.text,
                author:
                  q.author || ""
              })
            );

          saveQuotes();

          index = 0;
          editingIndex = null;

          render();

          alert(
            "Ritual backup restored."
          );
        } catch {
          alert(
            "Ritual could not read that backup file."
          );
        }
      }
    );

    document
      .getElementById("addBtn")
      .addEventListener(
        "click",
        () => {
          editingIndex = null;

          document
            .querySelector(
              ".sheet h2"
            )
            .textContent =
              "Add a quote";

          document
            .getElementById(
              "saveBtn"
            )
            .textContent =
              "Save Quote";

          modal.classList.add(
            "open"
          );

          modal.setAttribute(
            "aria-hidden",
            "false"
          );

          quoteInput.value = "";
          authorInput.value = "";

          setTimeout(
            () =>
              quoteInput.focus(),
            100
          );
        }
      );

    editQuoteBtn.addEventListener(
      "click",
      () => {
        editingIndex = index;

        quoteInput.value =
          quotes[index].text;

        authorInput.value =
          quotes[index].author || "";

        document
          .querySelector(
            ".sheet h2"
          )
          .textContent =
            "Edit quote";

        document
          .getElementById(
            "saveBtn"
          )
          .textContent =
            "Save Changes";

        modal.classList.add(
          "open"
        );

        modal.setAttribute(
          "aria-hidden",
          "false"
        );

        setTimeout(
          () =>
            quoteInput.focus(),
          100
        );
      }
    );

    deleteQuoteBtn.addEventListener(
      "click",
      () => {
        if (
          !confirm(
            "Delete this quote?"
          )
        ) {
          return;
        }

        quotes.splice(
          index,
          1
        );

        if (
          quotes.length === 0
        ) {
          quotes =
            starterQuotes.map(
              q => ({
                ...q
              })
            );
        }

        index = Math.min(
          index,
          quotes.length - 1
        );

        saveQuotes();

        render();
      }
    );

    document
      .getElementById(
        "cancelBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );

    modal.addEventListener(
      "click",
      e => {
        if (
          e.target === modal
        ) {
          closeModal();
        }
      }
    );

    function closeModal() {
      modal.classList.remove(
        "open"
      );

      modal.setAttribute(
        "aria-hidden",
        "true"
      );

      quoteInput.blur();
      authorInput.blur();
    }

    document
      .getElementById(
        "saveBtn"
      )
      .addEventListener(
        "click",
        () => {
          const text =
            quoteInput.value.trim();

          const author =
            authorInput.value.trim();

          if (!text) {
            quoteInput.focus();

            return;
          }

          if (
            editingIndex === null
          ) {
            quotes.push({
              text,
              author
            });

            index =
              quotes.length - 1;
          } else {
            quotes[
              editingIndex
            ] = {
              text,
              author
            };

            index =
              editingIndex;
          }

          saveQuotes();

          editingIndex = null;

          render();

          closeModal();
        }
      );

    render();

    if (
      "serviceWorker" in navigator
    ) {
      window.addEventListener(
        "load",
        () =>
          navigator
            .serviceWorker
            .register("sw.js")
            .catch(() => {})
      );
    }
  </script>

</body>
</html>
