<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0d0d;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid #292929;
}

.logo {
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 1px;
}

.add {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid #555;
  background: #181818;
  color: white;
  font-size: 30px;
  line-height: 40px;
}

main {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  touch-action: pan-y;
}

.card {
  width: 100%;
  max-width: 600px;
  min-height: 58vh;
  background: #171717;
  border: 1px solid #333;
  border-radius: 24px;
  padding: 38px 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: Georgia, serif;
  font-size: clamp(28px, 7vw, 46px);
  line-height: 1.35;
  box-shadow: 0 15px 45px rgba(0,0,0,.35);
  user-select: none;
}

.hint {
  position: absolute;
  bottom: 12px;
  color: #777;
  font-size: 13px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.88);
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 22px;
}

.modal-box {
  width: 100%;
  max-width: 520px;
  background: #181818;
  border: 1px solid #444;
  border-radius: 22px;
  padding: 25px;
}

.modal-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 18px;
}
